<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Jane Doe | Portfolio</title>
  <meta name="description" content="Get in touch with Jane Doe for front-end web development opportunities.">
  <link rel="canonical" href="https://janedoe.dev">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <div class="logo">
      <a href="index.html" aria-label="Jane Doe Portfolio Home">Jane Doe</a>
    </div>
    <nav aria-label="Main Navigation">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="container">
    <section aria-labelledby="contact-heading" class="contact-section">
      <h1 id="contact-heading">Contact Me</h1>
      <p>Have a project in mind? Fill out the form below, and I will get back to you shortly.</p>

      <form action="#" method="POST" class="contact-form" novalidate>
        <div class="form-group">
          <label id="name-label" for="user-name">Full Name (Required)</label>
          <input type="text" id="user-name" name="name" required aria-required="true" aria-labelledby="name-label">
        </div>

        <div class="form-group">
          <label id="email-label" for="user-email">Email Address (Required)</label>
          <input type="email" id="user-email" name="email" required aria-required="true" aria-labelledby="email-label" aria-describedby="email-hint">
          <span id="email-hint" class="form-hint">Format: name@example.com</span>
        </div>

        <div class="form-group">
          <label id="message-label" for="user-message">Your Message (Required)</label>
          <textarea id="user-message" name="message" rows="5" required aria-required="true" aria-labelledby="message-label"></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Jane Doe. All rights reserved.</p>
  </footer>

</body>
</html>
